{% extends "base.html" %}
{% block content %}
<h2>{{ "Modifier le bot" if bot else "Ajouter un bot" }}</h2>
<form method="post" class="mt-3" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Nom du bot</label>
        <input type="text" name="name" class="form-control" value="{{ bot.name if bot else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Token Discord</label>
        <input type="text" name="token" class="form-control" value="{{ bot.token if bot else '' }}" required>
        <div class="form-text text-warning">⚠️ Le token donne un accès total au bot. Ne le partagez jamais.</div>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
